# Main settings for the morning dashboard.
# Edit, commit, and the next scheduled run picks the change up.
# The run times themselves live in .github/workflows/daily.yml.

[run]
timezone = "Asia/Dubai"
ready_by = "09:30"
dashboard_url = "https://sanjay-market-brief.pages.dev"

[dld]
# data.dubai dataset ids (Dubai Land Department open data)
transactions_dataset = 470061
rents_dataset = 468586
projects_dataset = 467654
developers_dataset = 462802
listing_url = "https://data.dubai/o/dda/data-services/dataset-download?datasetId={id}&page=1&pageSize=30&sortDir=desc"
# Data API (used once DATADUBAI_API_KEY / DATADUBAI_API_SECRET secrets exist)
api_base = "https://apis.data.dubai/open/dld"
token_url = "https://api.dubaipulse.gov.ae/oauth/client_credential/accesstoken?grant_type=client_credentials"
# How much raw history to keep in the repo; older months become monthly aggregates
keep_raw_months = 25
# A "sale" is DLD's Sales transaction group minus these procedures. Checked on
# 29 Sep 2026 against DLD's published weekly totals (7-11 Sep: 2,931 sales /
# AED 6.78bn; 21-25 Sep: 2,426 / AED 6.41bn): this rule lands within about 1%.
exclude_procedures = ["Sell Development", "Delayed Sell Development", "Delayed Development"]
# A day with fewer sales than this is treated as a weekend/holiday or a partial load
min_deals_full_day = 100
# data.dubai's daily file runs a few days behind (29 Sep file ends on Fri 25 Sep).
# Alert on Telegram only if the newest DLD day is older than this.
stale_after_days = 5

[pulse]
# Minimum deals in each window before a % change is shown
min_sample = 20
busiest_n = 10
rising_n = 5
rising_min_deals = 40
largest_n = 5

[llm]
# Hard daily cap across all providers. Free tiers allow far more; this keeps
# usage tiny and predictable. Providers are tried in order; a provider whose
# key isn't set in GitHub Secrets is skipped. To switch providers when a free
# tier changes, reorder this list or change the model name.
daily_call_cap = 20
providers = [
  { name = "gemini", model = "gemini-flash-lite-latest", key_env = "GEMINI_API_KEY" },
  { name = "groq", model = "llama-3.3-70b-versatile", key_env = "GROQ_API_KEY" },
]

[news]
top_n = 10
window_hours = 24
archive_days = 30
# Feeds that answer GitHub's servers (checked 29 Sep 2026). Arabian Business
# blocks them, so it isn't listed. Order = which outlet wins when several
# carry the same story. tz is used when a feed omits the time zone.
feeds = [
  { name = "US Federal Reserve", url = "https://www.federalreserve.gov/feeds/press_monetary.xml", kind = "official" },
  { name = "Reserve Bank of India", url = "https://www.rbi.org.in/pressreleases_rss.xml", kind = "official", tz = "+05:30" },
  { name = "The National", url = "https://www.thenationalnews.com/arc/outboundfeeds/rss/?outputType=xml" },
  { name = "Khaleej Times", url = "https://www.khaleejtimes.com/stories.rss" },
  { name = "Gulf News", url = "https://gulfnews.com/feed" },
  { name = "The National (property)", url = "https://www.thenationalnews.com/arc/outboundfeeds/rss/category/business/property/?outputType=xml" },
  { name = "Economy Middle East", url = "https://economymiddleeast.com/feed/" },
  # News searches (added 13 Oct 2026). The newspapers' own feeds carry every kind of story and
  # only their latest few dozen, so most property news never reached this page. A search feed
  # returns property stories from every outlet, including ones whose own feeds refuse automated
  # readers (Arabian Business, Zawya, Construction Week). kind = "search" credits the outlet.
  { name = "News search: Dubai property", kind = "search", url = "https://news.google.com/rss/search?q=%22Dubai%22%20%28%22real%20estate%22%20OR%20property%29%20when%3A1d&hl=en-AE&gl=AE&ceid=AE:en" },
  { name = "News search: launches", kind = "search", url = "https://news.google.com/rss/search?q=%28Emaar%20OR%20Sobha%20OR%20Binghatti%20OR%20Arada%20OR%20Ellington%20OR%20Nakheel%20OR%20Omniyat%20OR%20Meraas%20OR%20Aldar%20OR%20Beyond%20OR%20Meraki%29%20%28launch%20OR%20launches%20OR%20unveils%20OR%20%22sold%20out%22%29%20when%3A2d&hl=en-AE&gl=AE&ceid=AE:en" },
  { name = "News search: rules and fees", kind = "search", url = "https://news.google.com/rss/search?q=%28%22Dubai%20Land%20Department%22%20OR%20RERA%20OR%20DLD%20OR%20Ejari%20OR%20%22golden%20visa%22%29%20when%3A2d&hl=en-AE&gl=AE&ceid=AE:en" },
  { name = "News search: Sharjah and Abu Dhabi", kind = "search", url = "https://news.google.com/rss/search?q=%28Sharjah%20OR%20%22Abu%20Dhabi%22%29%20%28%22real%20estate%22%20OR%20property%29%20when%3A1d&hl=en-AE&gl=AE&ceid=AE:en" },
]

[listings]
# The Top 10 on Sanjay's site: /watch.json lists each project's facts and where to check them.
site_url = "https://propertywithsanjay.com"
watch_url = "https://propertywithsanjay.com/watch.json"
news_days = 14
