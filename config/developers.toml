# Sharjah top 5 developers (agreed 29 Sep 2026). Ranked by listed projects on
# Property Finder's Sharjah developer directory, keeping Arada and Alef.
# Sharjah has no deal-level open data, so resale prices show as N/A.
# Edit freely; the News and Pipeline modules link each developer's latest items.

[[sharjah]]
name = "Arada"
flagships = ["Aljada", "Masaar", "Nasma Residences"]
match = ["arada", "aljada", "masaar"]

