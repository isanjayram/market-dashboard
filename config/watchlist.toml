developer = "Arada"

[[sharjah]]
name = "Al Khan"
developer = "Alef (SEEF)"

[[sharjah]]
name = "Al Mamzar, Sharjah"
developer = "Alef (Linar)"

[[sharjah]]
name = "Al Suyoh"
developer = "Arada (Masaar)"

