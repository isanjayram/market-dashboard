# Watchlist: the areas shown in the Watchlist card.
#
# Each [[dubai]] entry matches DLD sales by DLD's official community name
# (area_name_en) and, optionally, by master project name. Patterns are
# case-insensitive and use % as a wildcard (SQL LIKE).
#   areas            = DLD community names to include
#   master_like      = include rows whose master project matches any pattern
#   master_not_like  = then drop rows whose master project matches any pattern
#
# To add an area: copy a block, change the name and the match rules, commit.
# The daily "Busiest" and "Rising fastest" lists are automatic and need no editing.

[[dubai]]
name = "Downtown Dubai"
areas = ["Burj Khalifa"]

[[dubai]]
name = "Business Bay"
areas = ["Business Bay"]

[[dubai]]
name = "Dubai Marina"
areas = ["Marsa Dubai"]
master_not_like = ["%Beach Residence%"]

[[dubai]]
name = "JBR"
master_like = ["%Beach Residence%"]

[[dubai]]
name = "Palm Jumeirah"
areas = ["Palm Jumeirah"]

[[dubai]]
name = "Dubai Hills Estate"
areas = ["Hadaeq Sheikh Mohammed Bin Rashid"]

[[dubai]]
name = "JVC"
areas = ["Al Barsha South Fourth"]

[[dubai]]
name = "Arabian Ranches"
master_like = ["%Arabian Ranches%"]

[[dubai]]
name = "Dubai South"
areas = ["Madinat Al Mataar"]
note = "Includes Expo City and Emaar South"

[[dubai]]
name = "Dubai Creek Harbour"
areas = ["Al Khairan First"]

[[dubai]]
name = "MBR City"
areas = ["Al Merkadh"]
note = "Meydan One, Sobha Hartland, District One"

# (No DLD sales are registered under an "Al Mamzar" community, so there is no
#  Dubai-side benchmark for Linar. Checked 29 Sep 2026.)

