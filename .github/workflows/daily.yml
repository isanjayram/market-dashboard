name: Daily dashboard

on:
  schedule:
    # GitHub starts scheduled runs late (hours late at :00 and :30), so use odd minutes and
    # several slots. Each run takes about a minute; the page is ready well before 09:30 Gulf time.
    - cron: "17 1 * * *"   # 05:17 Gulf time
    - cron: "47 2 * * *"   # 06:47
    - cron: "43 3 * * *"   # 07:43
    - cron: "23 4 * * *"   # 08:23
    - cron: "53 4 * * *"   # 08:53
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's update already worked"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["data/state/dld_source.json", "data/state/mac_tick.json",   # the Mac pushed fresh DLD data or its daily wake-up
            "functions/**", "static/**", "templates/**", "migrations/**", "lib/**", "workers/**"]  # app or CRM code changed: redeploy

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

env:
  PAGES_PROJECT: sanjay-market-brief

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Skip if today's update already worked
        id: gate
        run: python -m pipeline.gate ${{ ((github.event_name == 'workflow_dispatch' && inputs.force) || github.event_name == 'push') && '--force' || '' }}

      - name: Build dashboard
        if: steps.gate.outputs.skip != 'true'
        env:
          DATADUBAI_API_KEY: ${{ secrets.DATADUBAI_API_KEY }}
          DATADUBAI_API_SECRET: ${{ secrets.DATADUBAI_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pipeline.run

      - name: Save today's snapshot to the repo
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Dubai date +%F)"
          git pull --rebase -X theirs origin main   # two runs close together: the newer snapshot wins
          git push

      # CRM data lives in a Cloudflare D1 database (free). This finds or creates it, writes the binding
      # into wrangler.toml for the deploy below, and applies new tables from migrations/crm.
      # If it fails (e.g. the API token lacks D1 permission), the brief still publishes; the CRM tab says so.
      - name: Connect the CRM database
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx --yes wrangler@4 d1 list --json | python3 -c "import json,sys; print(next((d.get('uuid') or d.get('id') for d in json.load(sys.stdin) if d.get('name') == 'sanjay-crm'), ''))"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx --yes wrangler@4 d1 create sanjay-crm > /dev/null && ID=$(find_id); fi
          [ -n "$ID" ] || { echo "::warning::CRM database not available (does the Cloudflare token have D1 Edit?)"; exit 1; }
          echo "CRM_DB_ID=$ID" >> "$GITHUB_ENV"
          cat > wrangler.toml <<EOF
          name = "$PAGES_PROJECT"
          pages_build_output_dir = "site"
          compatibility_date = "2026-10-01"

          [[d1_databases]]
          binding = "CRM"
          database_name = "sanjay-crm"
          database_id = "$ID"
          migrations_dir = "migrations/crm"
          EOF
          npx --yes wrangler@4 d1 migrations apply sanjay-crm --remote

      - name: Publish to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main > /dev/null 2>&1 || true
          printf '%s' "$DASHBOARD_PASSWORD" | npx --yes wrangler@4 pages secret put DASHBOARD_PASSWORD --project-name "$PAGES_PROJECT"
          # The CRM pings Telegram itself when an inbound lead arrives (call within 5 minutes).
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 pages secret put TELEGRAM_BOT_TOKEN --project-name "$PAGES_PROJECT"
            printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@4 pages secret put TELEGRAM_CHAT_ID --project-name "$PAGES_PROJECT"
          fi
          npx --yes wrangler@4 pages deploy site --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      # Reminder scheduler (a free Cloudflare Worker, every 5 minutes): phone notifications for inbound
      # leads still waiting, meetings in 60 / 10 minutes, tasks falling due and the morning plan.
      - name: Deploy the CRM reminder scheduler
        if: steps.gate.outputs.skip != 'true' && env.CRM_DB_ID != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > workers/crm-cron/wrangler.toml <<EOF
          name = "sanjay-crm-cron"
          main = "index.js"
          compatibility_date = "2026-10-01"
          workers_dev = false

          [triggers]
          crons = ["*/5 * * * *"]

          [[d1_databases]]
          binding = "CRM"
          database_name = "sanjay-crm"
          database_id = "$CRM_DB_ID"
          EOF
          npx --yes wrangler@4 deploy --config workers/crm-cron/wrangler.toml

      - name: Send the morning summary on Telegram
        if: steps.gate.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.notify outbox

      - name: Alert on Telegram if anything above failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.notify failure "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
